name: CI

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # services/auth.py refuses to import without this, which is the point —
      # the app must never invent its credential-encryption key. CI's copy is
      # throwaway: it encrypts nothing that outlives the job.
      ARTHA_SECRET_KEY: ci-only-not-a-real-secret-0000000000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # The database is gitignored, so CI starts with no file at all. Create the
      # schema: 8 tests need the tables to exist. The ~10 that assert on real
      # ETL contents carry @pytest.mark.needs_data and skip themselves here.
      - run: python -c "from db import init_database; init_database()"
      - run: python -m pytest tests/ -q

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: npm run typecheck --prefix web
