# GitHub Pages configuration for the ARTHA Terminal docs site.
#
# Source: master branch, /docs folder. GitHub builds this with Jekyll; the theme
# and the seo plugin are both on the Pages allow-list, so nothing needs to be
# vendored or built locally.
#
# `title` and `description` are what jekyll-seo-tag writes into <title> and the
# meta description — i.e. what a search engine shows. They deliberately repeat
# the terms someone would actually type: Upstox, NSE, dashboard, option chain.

title: ARTHA Terminal
description: >-
  Self-hosted Indian stock market dashboard. Live NSE and BSE data through the
  Upstox API, an F&O option chain and level engine, portfolio tracking, and a
  database-grounded AI analyst. Next.js and Python, runs in Docker.

url: https://personalaiengines.github.io
baseurl: /artha-terminal

# Card image for links shared to LinkedIn/Twitter/Slack. Same 1280x640 file the
# repo uses as its social preview; assets/_social-preview.html is the source it
# was rendered from, so it can be edited and re-shot rather than redrawn.
#
# This has to be a front matter default, not a top-level `image:` key —
# jekyll-seo-tag reads `page.image` and ignores `site.image`, so the top-level
# form emitted no og:image at all. The path is site-root-relative because
# seo-tag runs it through `absolute_url`, which prepends the baseurl itself;
# writing /artha-terminal/... here would double the prefix.
#
# twitter:card is left unset deliberately: seo-tag picks summary_large_image on
# its own once an image exists, and naming a `twitter:` block without a
# username made it emit a bare `<meta name="twitter:site" content="@">`.
defaults:
  - scope: { path: "" }
    values:
      image: /assets/social-preview.png

theme: jekyll-theme-cayman
# jekyll-sitemap writes /sitemap.xml at build. It is the URL you hand to Google
# Search Console and Bing Webmaster Tools so the crawler is told about every
# page at once instead of finding them by following links that do not exist yet.
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# The repo link in the theme header.
github:
  repository_url: https://github.com/personalaiengines/artha-terminal
show_downloads: false
